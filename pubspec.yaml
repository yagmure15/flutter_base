name: flutter_base
description: "A new Flutter Base project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  auto_route: ^11.1.0
  # Güvenli ortam değişkenleri için
  envied: ^1.3.2
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.2.0
  injectable: ^2.7.1+4
  logger: ^2.6.2
  slang: ^4.11.1
  slang_flutter: ^4.11.0

dev_dependencies:
  # Kod üretimi için
  auto_route_generator: ^10.4.0
  build_runner: ^2.10.4
  envied_generator: ^1.3.2
  flutter_flavorizr: ^2.4.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.12.0
  slang_build_runner: ^4.11.0

flavorizr:
  app:
    android:
      flavorDimensions: "flavor"
    ios:
      bundleId: "com.example.flutter_base"
  flavors:
    dev:
      app:
        name: "Flutter Base Dev"
      android:
        applicationId: "com.example.flutter_base.dev"
      ios:
        bundleId: "com.example.flutter_base.dev"
    staging:
      app:
        name: "Flutter Base Staging"
      android:
        applicationId: "com.example.flutter_base.staging"
      ios:
        bundleId: "com.example.flutter_base.staging"
    prod:
      app:
        name: "Flutter Base"
      android:
        applicationId: "com.example.flutter_base"
      ios:
        bundleId: "com.example.flutter_base"

