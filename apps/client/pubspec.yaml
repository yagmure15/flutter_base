name: flutter_base
description: "A new Flutter Base project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  app_ui:
    path: ../../packages/app_ui
  auto_route: ^7.8.4
  # Güvenli ortam değişkenleri için
  envied: ^0.5.2
  flutter:
    sdk: flutter
  flutter_base_core:
    path: ../../packages/core
  flutter_bloc: ^8.1.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  get_it: ^7.6.0
  injectable: ^2.3.0
  slang: ^3.31.0
  slang_flutter: ^3.31.0

dev_dependencies:
  # Kod üretimi için
  auto_route_generator: ^7.3.2
  build_runner: ^2.4.6
  envied_generator: ^0.5.2

  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.4.1
  melos: ^6.3.1
  slang_build_runner: ^3.31.0

flavorizr:
  app:
    android:
      flavorDimensions: "flavor"
    ios:
      bundleId: "com.example.flutter_base"
  flavors:
    dev:
      app:
        name: "Flutter Base Dev"
      android:
        applicationId: "com.example.flutter_base.dev"
      ios:
        bundleId: "com.example.flutter_base.dev"
    staging:
      app:
        name: "Flutter Base Staging"
      android:
        applicationId: "com.example.flutter_base.staging"
      ios:
        bundleId: "com.example.flutter_base.staging"
    prod:
      app:
        name: "Flutter Base"
      android:
        applicationId: "com.example.flutter_base"



# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
