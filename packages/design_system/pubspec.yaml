name: design_system
description: "Project Design System"
version: 0.0.1
homepage:

environment:
  sdk: ^3.6.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  widgetbook: ^3.0.0
  widgetbook_annotation: ^3.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  widgetbook_generator: ^3.0.0
  build_runner: ^2.4.6
  flutter_gen_runner: ^5.3.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

flutter_gen:
  output: lib/src/generated/
  line_length: 80
  integrations:
    flutter_svg: true
