name: design_system
description: "Project Design System"
version: 0.0.1
homepage:

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  cached_network_image: ^3.4.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.16.0
  flutter_gen_runner: ^5.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5

  widgetbook_generator: ^3.24.0
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/

flutter_gen:
  output: lib/src/generated/
  line_length: 80
  integrations:
    flutter_svg: true
