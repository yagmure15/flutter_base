name: flutter_base_core
description: A robust, opinionated core infrastructure for Flutter apps. Includes network (Dio), storage, and logging utilities designed for Feature-First Clean Architecture.
version: 0.1.0
homepage: https://github.com/yagmure15/flutter_base
repository: https://github.com/yagmure15/flutter_base

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.1"

dependencies:
  connectivity_plus: ^7.3.1
  dio: ^5.11.0
  dio_smart_retry: ^7.0.1
  equatable: ^2.1.0
  firebase_analytics: ^12.4.6
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  formz: ^0.8.1
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  json_annotation: ^4.12.0
  logger: ^2.7.0
  permission_handler: ^13.0.1
  pretty_dio_logger: ^1.4.0
  shared_preferences: ^2.5.5

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.0
  injectable_generator: ^3.1.3
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
