name: Flutter Base CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v3
        with:
          channel: stable
          version: 3.47.1 # Keep in sync with .fvmrc

      - name: Install Melos
        run: dart pub global activate melos

      - name: Bootstrap Workspace
        run: melos bootstrap

      - name: Prepare .env files
        # Real secrets are git-ignored; the placeholder values from .env.example
        # are enough for code generation and analysis in CI.
        run: |
          for env in dev staging prod; do
            cp apps/client/.env.example "apps/client/.env.$env"
          done

      - name: Generate Code
        run: melos run gen

      - name: Analyze Project
        run: melos run analyze

      - name: Check Formatting
        run: melos run format:check

      - name: Run Tests
        run: melos run test
