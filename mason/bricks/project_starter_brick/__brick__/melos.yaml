name: {{name.snakeCase()}}_workspace

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    # Tüm paketler için pub get çalıştırılsın
    runPubGetInParallel: false
    
scripts:
  analyze:
    run: |
      melos exec -c 1 -- \
        dart analyze .
    description: "Tüm paketlerde analiz çalıştırır."

  format:
    run: |
      melos exec -c 1 -- \
        dart format .
    description: "Tüm paketleri formatlar."

  test:
    run: |
      melos exec -c 1 --dir-exists="test" -- \
        flutter test
    description: "Runs tests in all packages."

  test:select:
    run: |
      melos exec -c 1 --dir-exists="test" -- \
        flutter test
    description: "Testleri çalıştırır (sadece test klasörü olan paketlerde)."

  gen:
    run: melos exec --depends-on="build_runner" -- flutter pub run build_runner build --delete-conflicting-outputs
    description: "Generate code for all packages"

  clean:
    run: |
      melos exec -- \
        flutter clean
    description: "Tüm paketleri temizler."
    
  postbootstrap:
    run: dart pub global activate flutter_gen
    description: "Global araçları kurar."
