  injectable: ^2.3.0
  slang: ^3.31.0
  slang_flutter: ^3.31.0

dev_dependencies:
  auto_route_generator: ^7.3.2
  bloc_test: ^9.1.7
  build_runner: ^2.4.6
  envied_generator: ^0.5.2

  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  injectable_generator: ^2.4.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.8.0
