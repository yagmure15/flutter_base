name: {{name.snakeCase()}}
description: "A new {{name.titleCase()}} project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.13.1

dependencies:
  auto_route: ^11.1.0
  dartz: ^0.10.1
  design_system:
