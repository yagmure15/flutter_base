name: {{name.snakeCase()}}
description: "A new {{name.titleCase()}} project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  auto_route: ^7.8.4
  dartz: ^0.10.1
  design_system:
    path: ../../packages/design_system
  envied: ^0.5.2
  firebase_analytics: ^12.1.0
  firebase_core: ^4.3.0
