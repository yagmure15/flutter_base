plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.{{name.snakeCase()}}"
    // flutter_secure_storage 11 / permission_handler 13 compile against SDK 37.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.{{name.snakeCase()}}"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures {
        // Needed for the per-flavor `resValue` entries below (off by default since AGP 8).
        resValues = true
    }

    // Flavors mirror the Dart entrypoints (lib/main_<flavor>.dart) and the iOS
    // schemes (dev / staging / prod). Always build with `--flavor <name>`, e.g.
    //   flutter run --flavor dev -t lib/main_dev.dart
    // Flavor-specific resources (icons etc.) live in src/<flavor>/res.
    flavorDimensions += ["environment"]
    productFlavors {
        dev {
            dimension = "environment"
            applicationIdSuffix = ".dev"
            versionNameSuffix = "-dev"
            resValue "string", "app_name", "{{name.titleCase()}} Dev"
        }
        staging {
            dimension = "environment"
            applicationIdSuffix = ".staging"
            versionNameSuffix = "-staging"
            resValue "string", "app_name", "{{name.titleCase()}} Staging"
        }
        prod {
            dimension = "environment"
            resValue "string", "app_name", "{{name.titleCase()}}"
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}