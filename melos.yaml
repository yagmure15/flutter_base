name: flutter_base_workspace

packages:
  - apps/*
  - packages/*

command:
  bootstrap:
    # Tüm paketler için pub get çalıştırılsın
    runPubGetInParallel: false
    
scripts:
  analyze:
    run: |
      melos exec -c 1 -- \
        dart analyze .
    description: "Tüm paketlerde analiz çalıştırır."

  format:
    run: |
      melos exec -c 1 -- \
        dart format .
    description: "Tüm paketleri formatlar."

  format:check:
    run: |
      melos exec -c 1 -- \
        dart format --set-exit-if-changed --output=none .
    description: "Formatı kontrol eder (CI); formatlanmamış dosya varsa hata döner."

  test:
    run: |
      melos exec -c 1 --dir-exists="test" -- \
        flutter test
    description: "Runs tests in all packages."

  test:select:
    run: |
      melos exec -c 1 --dir-exists="test" -- \
        flutter test
    description: "Testleri çalıştırır (sadece test klasörü olan paketlerde)."

  gen:
    run: |
      melos run gen:slang && melos run gen:build_runner && melos run format
    description: "Generate code for all packages (slang, build_runner) and format the output"

  gen:slang:
    run: |
      melos exec -c 1 --depends-on="slang" -- \
        dart run slang
    description: "Generate translations (slang CLI) so build_runner can resolve them."

  gen:build_runner:
    run: |
      melos exec -c 1 --depends-on="build_runner" -- \
        dart run build_runner build
    description: "Run build_runner in all packages (sequentially to avoid locks)"

  clean:
    run: |
      melos exec -- \
        flutter clean
    description: "Tüm paketleri temizler."
    
  postbootstrap:
    run: dart pub global activate flutter_gen
    description: "Global araçları kurar."
